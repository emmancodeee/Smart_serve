<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Schedule</title>
<link rel="stylesheet" href="css/tailwind.css" />
<link rel="stylesheet" href="css/responsive.css" />
<link rel="stylesheet" href="css/theme.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .student-shell {
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(59, 130, 246, 0.16), transparent 24%),
        linear-gradient(180deg, #f7fbff 0%, #eef4fb 100%);
    }

    .student-sidebar {
      width: 100%;
      background: linear-gradient(180deg, #17357f 0%, #2447a8 54%, #315fda 100%);
    }

    .student-main {
      width: 100%;
      min-width: 0;
    }

    .student-header-inner,
    .student-main-inner {
      max-width: 1280px;
      margin: 0 auto;
    }

    .student-topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: #152c69;
      color: #ffffff;
      box-shadow: 0 10px 24px rgba(21, 44, 105, 0.24);
    }

    .student-welcome {
      color: #ffffff;
      font-size: 1.7rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.1;
    }

    .student-status-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.55rem 1.35rem;
      border: 1px solid #86efac;
      border-radius: 999px;
      background: #d1fae5;
      color: #065f46;
      font-size: 0.88rem;
      font-weight: 700;
      box-shadow: 0 8px 16px rgba(16, 185, 129, 0.12);
    }

    .student-clock {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 305px;
      padding: 0.85rem 1.35rem;
      border: 1px solid rgba(253, 224, 71, 0.85);
      border-radius: 1.25rem;
      background: #1d3b86;
      color: #ffffff;
      font-size: 0.88rem;
      font-weight: 700;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .student-logout {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 126px;
      padding: 0.85rem 1.65rem;
      border: 1px solid #fde047;
      border-radius: 999px;
      background: #ffda47;
      color: #183575;
      font-size: 0.92rem;
      font-weight: 700;
      box-shadow: 0 10px 18px rgba(250, 204, 21, 0.18);
    }

    .student-panel {
      border: 1px solid #d9e6fb;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 16px 42px rgba(30, 58, 138, 0.12);
    }

    .schedule-stat-card {
      min-height: 124px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .schedule-stat-label {
      color: #1d4ed8;
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .schedule-stat-value {
      margin-top: 0.7rem;
      color: #0b1f4d;
      font-size: 3rem;
      font-weight: 800;
      line-height: 1;
    }

    .schedule-main-surface {
      min-height: 520px;
    }

    .schedule-empty-state {
      min-height: 112px;
      border: 1px dashed #c7d7ee;
      border-radius: 22px;
      background: #fbfdff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #5a77a3;
      font-size: 1rem;
    }

    .schedule-date-input {
      min-width: 190px;
      height: 50px;
      border-radius: 18px;
    }

    .schedule-view-chip {
      min-width: 76px;
      height: 48px;
      border-radius: 16px;
    }

    @media (min-width: 1024px) {
      .student-shell {
        display: flex;
      }

      .student-sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: 270px;
        overflow-y: auto;
      }

      .student-main {
        margin-left: 270px;
        width: calc(100% - 270px);
      }
    }

    @media (max-width: 768px) {
      .student-welcome {
        font-size: 1.3rem;
      }

      .student-clock {
        min-width: 0;
        width: 100%;
      }
    }

      .student-page-title {
        color: rgba(219, 234, 254, 0.85);
        font-size: 0.95rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        line-height: 1.1;
      }

      .student-search {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 42px;
        padding: 0 14px;
        border: 1px solid rgba(253, 224, 71, 0.45);
        border-radius: 12px;
        background: #1d3b86;
        color: rgba(219, 234, 254, 0.8);
      }

      .student-search:focus-within {
        border-color: #fde047;
        box-shadow: 0 0 0 3px rgba(253, 224, 71, 0.18);
      }

      .student-search .search-input {
        border: none;
        background: transparent;
        outline: none;
        font-size: 0.85rem;
        color: #ffffff;
        width: 120px;
      }

      .student-search .search-input::placeholder {
        color: rgba(219, 234, 254, 0.55);
      }

      .student-profile {
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }

      .student-avatar {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: #ffda47;
        color: #183575;
        font-size: 1rem;
        font-weight: 700;
        flex-shrink: 0;
      }

      .student-profile-info {
        display: flex;
        flex-direction: column;
        line-height: 1.2;
      }

      .student-profile-name {
        color: #ffffff;
        font-size: 0.9rem;
        font-weight: 700;
        white-space: nowrap;
      }

      .student-profile-role {
        color: rgba(219, 234, 254, 0.75);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .student-bell {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        color: #ffffff;
        background: #1d3b86;
        border: 1px solid rgba(253, 224, 71, 0.45);
      }

      .student-bell svg {
        width: 20px;
        height: 20px;
      }

      .student-bell-dot {
        position: absolute;
        top: 8px;
        right: 9px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #ffda47;
        border: 2px solid #152c69;
      }

      @media (max-width: 640px) {
        .student-page-title {
          font-size: 0.85rem;
        }

        .student-profile-info {
          display: none;
        }

        .student-search .search-input {
          width: 90px;
        }
      }
  </style>

  <style>
    /* standardize-student-ui: schedule loads its inline <style>
       after theme.css, so re-assert the shared shell rules here. */
    body.theme-light :is(.dashboard-sidebar, .student-sidebar) {
      background: linear-gradient(180deg, #17357f 0%, #2447a8 54%, #315fda 100%) !important;
    }

    /* The active link uses the shared treatment from theme.css (gold icon
       tile and edge bar), like every other student and admin page. */

    /* Mini calendar: theme.css repaints every .calendar-day with !important,
       which erased the "today" highlight; the picked day gets its own state
       so clicking a date shows which one the views are following. */
    body.theme-light .calendar-day.is-today {
      border-color: #1d4ed8 !important;
      background: #1d4ed8 !important;
      color: #ffffff !important;
    }

    body.theme-light .calendar-day.is-selected:not(.is-today) {
      border-color: #315fda !important;
      background: #eff6ff !important;
      color: #1d4ed8 !important;
      box-shadow: inset 0 0 0 1px #315fda;
    }

    body.theme-light .calendar-day.is-today.is-selected {
      box-shadow: 0 0 0 2px #ffffff, 0 0 0 4px #1d4ed8;
    }

    /* "View Only" is a status label, not a button: theme.css gives every
       .schedule-view-chip the white button look, so tone it down here. */
    body.theme-light .schedule-view-chip.schedule-view-only {
      border-style: dashed !important;
      background: #f1f5f9 !important;
      color: #5a6f8d !important;
      cursor: default;
    }
  </style>
  <link rel="stylesheet" href="/css/app-shell.css">
  <script src="/js/app-shell.js"></script>
  <script src="/js/ui-kit.js"></script>
  <script src="/js/student-nav.js"></script>
</head>
<body class="theme-light min-h-screen bg-[#eef5ff] text-slate-900 [font-family:'IBM_Plex_Sans',sans-serif]">
  <div id="sidebarOverlay" class="app-sidebar-overlay" aria-hidden="true"></div>
  <div class="student-shell app-shell min-h-screen">
    <aside id="sidebar" class="student-sidebar app-sidebar user-sidepanel w-full border-r border-white/20 text-white">
      <div class="app-brand flex items-center gap-4 border-b border-yellow-300/50 px-6 py-6">
        <span class="inline-flex h-14 w-14 items-center justify-center rounded-2xl border border-white/25 bg-white/10 shadow-inner">
          <svg class="h-6 w-6 text-yellow-300" width="24" height="24" style="width:24px;height:24px;flex-shrink:0;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M3 8.5 12 4l9 4.5-9 4.5L3 8.5Z"></path>
            <path d="M7 10.5V15c0 1.7 2.2 3 5 3s5-1.3 5-3v-4.5"></path>
            <path d="M19 10v5"></path>
          </svg>
        </span>
        <h2 id="sidebarSectionTitle" class="app-brand-name text-[1.9rem] font-bold tracking-[0.025em] leading-[1.16]">Smart Serve</h2>
      </div>
      <ul class="app-nav-list grid grid-cols-1 gap-2 p-6" data-student-nav></ul>
    </aside>

    <div class="student-main app-main main-content w-full min-w-0">
      <header class="student-topbar">
        <div class="student-header-inner flex flex-wrap items-center justify-between gap-3 px-5 py-3 md:px-7">
          <div class="header-left flex flex-wrap items-center gap-4">
            <button type="button" class="app-sidebar-toggle" data-sidebar-toggle aria-controls="sidebar" aria-expanded="false" aria-label="Open navigation">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <div class="flex flex-wrap items-baseline gap-x-3 gap-y-1">
              <h1 id="scheduleHeaderTitle" class="student-welcome">Welcome</h1>
            </div>
            <span id="headerClock" class="student-clock hidden rounded-2xl border border-yellow-300/80 bg-[#1d3b86] px-4 py-2 text-[0.86rem] font-semibold text-white md:inline-flex"></span>
            <span id="scheduleStatusBadge" class="student-status-pill">Status: -</span>
          </div>
          <div class="header-right flex flex-wrap items-center justify-end gap-3 sm:flex sm:items-center sm:gap-4">
            <div class="app-notifications" data-notifications>
              <button type="button" class="student-bell header-bell" data-notifications-trigger aria-haspopup="true" aria-expanded="false" aria-label="Notifications">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
                <span class="student-bell-dot" data-notifications-badge hidden></span>
              </button>
              <div class="app-notifications-panel" data-notifications-panel hidden></div>
            </div>
            <div class="app-profile-menu" data-profile-menu>
              <button type="button" class="student-profile app-profile-trigger" data-profile-trigger aria-haspopup="menu" aria-expanded="false">
                <span class="student-avatar" id="studentAvatar">S</span>
                <span class="student-profile-info">
                  <span class="student-profile-name" id="studentProfileName">Student</span>
                  <span class="student-profile-role">Student</span>
                </span>
                <svg class="app-profile-caret" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
              </button>
              <div class="app-profile-dropdown" data-profile-dropdown role="menu" hidden>
                <a class="app-menu-item" role="menuitem" href="/profile">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 21a8 8 0 1 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>
                  My Profile
                </a>
                <button id="logoutBtn" type="button" class="app-menu-item" role="menuitem">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                  Logout
                </button>
              </div>
            </div>
          </div>
        </div>
      </header>
      <div class="student-main-inner px-4 pb-8 pt-5 md:px-7">

      <section class="schedule-summary mb-5 grid gap-3 md:grid-cols-3">
        <article class="schedule-stat-card student-panel p-5">
          <h3 class="schedule-stat-label">Total Events</h3>
          <p id="totalCount" class="schedule-stat-value">0</p>
        </article>
        <article class="schedule-stat-card student-panel p-5">
          <h3 class="schedule-stat-label">Upcoming</h3>
          <p id="upcomingCount" class="schedule-stat-value">0</p>
        </article>
        <article class="schedule-stat-card student-panel p-5">
          <h3 class="schedule-stat-label">Busy Hours</h3>
          <p id="busyHours" class="schedule-stat-value">0h</p>
        </article>
      </section>

      <section class="schedule-container grid items-start gap-4 xl:grid-cols-[320px_minmax(0,1fr)]">
        <aside class="schedule-sidebar student-panel p-4 xl:sticky xl:top-[92px]">
          <div class="mini-calendar">
            <div class="calendar-header mb-3 flex items-center justify-between gap-2">
              <button type="button" class="inline-flex h-9 w-9 items-center justify-center rounded-xl border border-blue-200 bg-blue-50 text-xl font-bold text-blue-700 transition duration-200 hover:bg-blue-700 hover:text-white hover:shadow" id="previousMonthBtn">&#8249;</button>
              <h3 id="currentMonth" class="text-center text-sm font-bold text-[#2447a8]"></h3>
              <button type="button" class="inline-flex h-9 w-9 items-center justify-center rounded-xl border border-blue-200 bg-blue-50 text-xl font-bold text-blue-700 transition duration-200 hover:bg-blue-700 hover:text-white hover:shadow" id="nextMonthBtn">&#8250;</button>
            </div>
            <div id="miniCalendar" class="grid grid-cols-7 gap-2"></div>
          </div>
        </aside>

        <section class="schedule-main schedule-main-surface student-panel p-4">
          <div class="view-controls mb-4 grid grid-cols-2 gap-2 border-b border-slate-200 pb-4 sm:flex sm:flex-wrap sm:items-center">
            <input id="dateSelector" class="schedule-date-input col-span-2 w-full border border-blue-200 px-3 text-[0.96rem] font-medium text-slate-900 transition duration-200 hover:border-blue-400 focus:border-blue-500 focus:ring-4 focus:ring-blue-100 sm:col-span-1 sm:w-auto" type="date"  />
            <button class="view-btn schedule-view-chip active inline-flex w-full items-center justify-center border border-[#0b1f4d] bg-[#0b1f4d] px-4 text-[0.95rem] font-semibold text-white transition duration-200 hover:shadow sm:w-auto" data-view="day">Day</button>
            <button class="view-btn schedule-view-chip inline-flex w-full items-center justify-center border border-blue-200 bg-white px-4 text-[0.95rem] font-semibold text-slate-700 transition duration-200 hover:border-blue-400 hover:text-blue-700 hover:shadow sm:w-auto" data-view="week">Week</button>
            <button class="view-btn schedule-view-chip inline-flex w-full items-center justify-center border border-blue-200 bg-white px-4 text-[0.95rem] font-semibold text-slate-700 transition duration-200 hover:border-blue-400 hover:text-blue-700 hover:shadow sm:w-auto" data-view="month">Month</button>
            <button class="view-btn schedule-view-chip inline-flex w-full items-center justify-center border border-blue-200 bg-white px-4 text-[0.95rem] font-semibold text-slate-700 transition duration-200 hover:border-blue-400 hover:text-blue-700 hover:shadow sm:w-auto" data-view="list">List</button>
            <span class="schedule-view-chip schedule-view-only col-span-2 inline-flex w-full items-center justify-center border border-slate-300 bg-slate-100 px-4 text-[0.95rem] font-bold text-slate-600 sm:col-span-1 sm:w-auto">View Only</span>
          </div>

          <div id="calendarView" class="schedule-view block">
            <div id="dayView" class="day-view min-h-[420px] space-y-3"></div>
          </div>
          <div id="weekView" class="schedule-view hidden min-h-[420px]"></div>
          <div id="monthView" class="schedule-view hidden min-h-[420px]"></div>
          <div id="listView" class="schedule-view hidden">
            <div id="scheduleList" class="schedule-list min-h-[420px] space-y-3"></div>
          </div>
        </section>
      </section>
    </div>
  </div>
  </div>

  <div id="eventModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/60 p-4">
    <div class="w-full max-w-3xl overflow-y-auto rounded-2xl border border-blue-100 bg-white shadow-2xl max-h-[90vh]">
      <div class="flex items-center justify-between border-b border-slate-200 px-5 py-4">
        <h2 id="modalTitle" class="text-lg font-bold text-blue-900">Add New Event</h2>
        <button id="eventModalCloseBtn" class="text-2xl text-slate-400 transition hover:text-red-500" type="button" aria-label="Close">&times;</button>
      </div>
      <div class="p-5">
        <form id="eventForm" class="space-y-4">
          <input id="eventId" type="hidden" />

          <div class="grid gap-4 md:grid-cols-2">
            <div>
              <label class="mb-1 block text-sm font-semibold text-blue-900" for="eventTitle">Title</label>
              <input class="w-full rounded-lg border border-blue-200 px-3 py-2" id="eventTitle" required />
            </div>
            <div>
              <label class="mb-1 block text-sm font-semibold text-blue-900" for="eventType">Type</label>
              <select class="w-full rounded-lg border border-blue-200 px-3 py-2" id="eventType">
                <option>Task</option>
                <option>Class</option>
                <option>Study</option>
                <option>Exam</option>
                <option>Reminder</option>
                <option>AI Plan</option>
              </select>
            </div>
          </div>

          <div>
            <label class="mb-1 block text-sm font-semibold text-blue-900" for="eventDescription">Description</label>
            <textarea class="w-full rounded-lg border border-blue-200 px-3 py-2" id="eventDescription"></textarea>
          </div>

          <div class="grid gap-4 md:grid-cols-2">
            <div>
              <label class="mb-1 block text-sm font-semibold text-blue-900" for="eventStart">Start</label>
              <input class="w-full rounded-lg border border-blue-200 px-3 py-2" id="eventStart" type="datetime-local" required  />
            </div>
            <div>
              <label class="mb-1 block text-sm font-semibold text-blue-900" for="eventEnd">End</label>
              <input class="w-full rounded-lg border border-blue-200 px-3 py-2" id="eventEnd" type="datetime-local" required  />
            </div>
          </div>

          <div class="grid gap-4 md:grid-cols-2">
            <div>
              <label class="mb-1 block text-sm font-semibold text-blue-900" for="eventLocation">Location</label>
              <input class="w-full rounded-lg border border-blue-200 px-3 py-2" id="eventLocation" />
            </div>
            <div>
              <label class="mb-1 block text-sm font-semibold text-blue-900" for="eventModule">Module</label>
              <input class="w-full rounded-lg border border-blue-200 px-3 py-2" id="eventModule" />
            </div>
          </div>

          <div class="grid gap-4 md:grid-cols-2">
            <div>
              <label class="mb-1 block text-sm font-semibold text-blue-900" for="eventInstructor">Instructor</label>
              <input class="w-full rounded-lg border border-blue-200 px-3 py-2" id="eventInstructor" />
            </div>
            <div>
              <label class="mb-1 block text-sm font-semibold text-blue-900" for="eventPriority">Priority</label>
              <select class="w-full rounded-lg border border-blue-200 px-3 py-2" id="eventPriority">
                <option>Low</option>
                <option selected>Medium</option>
                <option>High</option>
                <option>Critical</option>
              </select>
            </div>
          </div>

          <div class="grid gap-4 md:grid-cols-2">
            <div>
              <label class="mb-1 block text-sm font-semibold text-blue-900" for="eventReminder">Reminder (minutes before)</label>
              <input class="w-full rounded-lg border border-blue-200 px-3 py-2" id="eventReminder" type="number" value="15" />
            </div>
            <div>
              <label class="mb-1 block text-sm font-semibold text-blue-900" for="eventColor">Color</label>
              <input class="h-10 w-full rounded-lg border border-blue-200 px-2" id="eventColor" type="color" value="#3498db" />
            </div>
          </div>

          <div>
            <div>
              <label><input id="eventRecurring" type="checkbox"  /> Recurring</label>
              <div id="recurrenceOptions" style="display:none; margin-top: 0.75rem;">
                <div class="grid gap-4 md:grid-cols-2">
                  <div>
                    <label class="mb-1 block text-sm font-semibold text-blue-900" for="recurrencePattern">Pattern</label>
                    <select class="w-full rounded-lg border border-blue-200 px-3 py-2" id="recurrencePattern">
                      <option value="daily">Daily</option>
                      <option value="weekly">Weekly</option>
                      <option value="monthly">Monthly</option>
                    </select>
                  </div>
                  <div>
                    <label class="mb-1 block text-sm font-semibold text-blue-900" for="recurrenceEnd">Ends On</label>
                    <input class="w-full rounded-lg border border-blue-200 px-3 py-2" id="recurrenceEnd" type="date" />
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div id="conflictWarning" class="hidden rounded-lg border-l-4 border-amber-500 bg-amber-50 p-3 text-amber-700">
            Conflict detected with another event.
          </div>

          <div class="grid grid-cols-2 gap-2 border-t border-slate-200 pt-4 sm:flex sm:justify-end">
            <button id="eventModalCancelBtn" type="button" class="inline-flex w-full items-center justify-center rounded-xl border border-slate-300 bg-white px-4 py-2.5 font-semibold text-slate-700 transition hover:bg-slate-100 sm:w-auto">Cancel</button>
            <button type="submit" class="inline-flex w-full items-center justify-center rounded-xl bg-[#0b1f4d] px-4 py-2.5 font-bold text-white transition hover:bg-[#132d67] sm:w-auto">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div id="detailsModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/60 p-4">
    <div class="w-full max-w-lg rounded-2xl border border-blue-100 bg-white shadow-2xl">
      <div class="flex items-center justify-between border-b border-slate-200 px-5 py-4">
        <h2 id="detailsTitle" class="text-lg font-bold text-blue-900"></h2>
        <button id="detailsModalCloseBtn" class="text-2xl text-slate-400 transition hover:text-red-500" type="button" aria-label="Close">&times;</button>
      </div>
      <div class="p-5">
        <div id="detailsContent"></div>
      </div>
      <div class="grid grid-cols-1 gap-2 border-t border-slate-200 bg-slate-50 px-5 py-4 sm:justify-end">
        <button id="detailsModalFooterCloseBtn" class="inline-flex w-full items-center justify-center rounded-xl border border-slate-300 bg-white px-4 py-2.5 font-semibold text-slate-700 transition hover:bg-slate-100" type="button">Close</button>
      </div>
    </div>
  </div>

  <script src="js/student-header.js"></script>
  <script src="js/schedule.js"></script>
</body>
</html>
